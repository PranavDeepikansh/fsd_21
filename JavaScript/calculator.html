<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       const sum = (x, y) => {
    return x + y;
};

const sub = (x, y) => {
    return x - y;
};

const mul = (x, y) => {
    return x * y;
};

const div = (x, y) => {
    return x / y;
};

document.write("Sum = " + sum(20, 10) + "<br>");
document.write("Sub = " + sub(20, 10) + "<br>");
document.write("Mul = " + mul(20, 10) + "<br>");
document.write("Div = " + div(20, 10) + "<br>");

    </script>
</body>
</html>
